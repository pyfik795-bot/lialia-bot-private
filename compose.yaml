name: lialia-bot

services:
  app:
    image: lialia-bot:portable
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lialia-bot
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "127.0.0.1:${LIALIA_WEB_PORT:-8080}:8080"
    volumes:
      # Рабочая папка хранит Telegram-сессию, JSON-состояние и логи.
      - ./:/data
      # Секреты не входят в Docker-образ и подключаются только при запуске.
      - ./config.py:/app/config.py:ro
    working_dir: /data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
