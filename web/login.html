<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Ляля Бот</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-border: #262c36;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3ecf8e;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top left, #131a24, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  form {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 32px 30px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  h1 { font-size: 18px; margin: 0 0 4px; text-align: center; }
  p.sub { color: var(--muted); font-size: 13px; text-align: center; margin: 0 0 22px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type="password"] {
    width: 100%;
    background: #0d1117;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input[type="password"]:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    background: var(--accent);
    color: #05130d;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  #msg { min-height: 18px; font-size: 13px; text-align: center; margin-top: 12px; color: var(--red); }
</style>
<style id="modern-redesign">
  :root {
    --bg: #050506;
    --panel: #101012;
    --panel-border: #2a2a2f;
    --text: #f5f5f6;
    --muted: #8e8e96;
    --accent: #ff3344;
    --red: #ff3344;
  }
  body {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    padding: 20px;
    background:
      radial-gradient(circle at 70% 10%, rgba(255,38,55,.2), transparent 30%),
      radial-gradient(circle at 15% 85%, rgba(113,9,20,.17), transparent 32%),
      #050506;
    font-family: Inter, "Segoe UI Variable", "Segoe UI", sans-serif;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: .18;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle, black, transparent 78%);
  }
  form {
    position: relative;
    max-width: 390px;
    padding: 38px 36px 32px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    background: linear-gradient(150deg, rgba(21,21,24,.97), rgba(8,8,10,.98));
    box-shadow: 0 30px 90px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter: blur(22px);
  }
  form::before {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #ff4251, transparent);
  }
  .login-mark {
    position: relative;
    display: grid;
    place-items: center;
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    overflow: hidden;
    border: 1px solid rgba(255,73,88,.55);
    border-radius: 17px;
    background: linear-gradient(145deg, #310b10, #0b0b0d 70%);
    font-size: 21px;
    font-weight: 900;
    box-shadow: 0 0 38px rgba(255,38,55,.18);
  }
  .login-mark::after {
    content: "";
    position: absolute;
    width: 70px;
    height: 2px;
    background: var(--red);
    transform: rotate(-45deg);
  }
  .eyebrow {
    margin-bottom: 5px;
    color: var(--red);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .22em;
    text-align: center;
    text-transform: uppercase;
  }
  h1 { margin-bottom: 7px; font-size: 23px; letter-spacing: -.035em; }
  h1 span { color: var(--red); }
  p.sub { margin-bottom: 27px; line-height: 1.5; }
  label { color: #a2a2aa; font-weight: 600; }
  input[type="password"] {
    height: 46px;
    margin-bottom: 14px;
    border: 1px solid #303035;
    border-radius: 12px;
    background: #080809;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type="password"]:focus {
    border-color: rgba(255,51,68,.78);
    box-shadow: 0 0 0 3px rgba(255,51,68,.1);
  }
  button {
    min-height: 46px;
    border: 1px solid #ff5361;
    border-radius: 12px;
    background: linear-gradient(180deg, #ff4050, #d71526);
    color: #fff;
    box-shadow: 0 10px 28px rgba(215,21,38,.24), inset 0 1px 0 rgba(255,255,255,.2);
    transition: transform .15s ease, filter .15s ease;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .secure-note { margin-top: 20px; color: #71717a; font-size: 11px; text-align: center; }
  #msg { color: #ff6572; }
  @media (max-width: 440px) {
    form { padding: 32px 24px 27px; border-radius: 20px; }
  }
</style>
</head>
<body>
<form id="login-form">
  <div class="login-mark">Л</div>
  <div class="eyebrow">Автоматическая торговая система</div>
  <h1>ЛЯЛЯ <span>БОТ</span></h1>
  <p class="sub">Авторизация в панели управления торговым контуром</p>
  <label for="password">Пароль</label>
  <input type="password" id="password" autocomplete="current-password" autofocus required>
  <button type="submit">Открыть панель</button>
  <div id="msg"></div>
  <div class="secure-note">● Защищённая локальная сессия</div>
</form>
<script>
document.getElementById("login-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Ошибка входа");
    location.reload();
  } catch (e) {
    msg.textContent = "❌ " + e.message;
  }
});
</script>
</body>
</html>
